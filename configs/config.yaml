# Основной конфиг для хакатона
data:
  train_path: "data/train"
  val_path: "data/val"
  test_path: "data/test"
  num_classes: 2  # поменяй под задачу
  
model:
  name: "resnet18"  # или efficientnet_b0, resnet34
  pretrained: true
  checkpoint_path: null  # путь к чекпоинту если есть

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  image_size: 224
  early_stopping: 10
  mixed_precision: true  # для ускорения на GPU

augmentation:
  use_albumentations: true
  horizontal_flip_prob: 0.5
  random_rotation: 15
  brightness_contrast: 0.2

logging:
  use_wandb: false
  wandb_project: "cv_hackathon"
  save_dir: "checkpoints"
  log_interval: 10
