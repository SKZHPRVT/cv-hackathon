# Основной конфиг для хакатона
data:
  train_path: "data/train"
  val_path: "data/val"
  test_path: "data/test"
  # CSV-разметка (опционально)
  train_csv: null
  val_csv: null
  
model:
  name: "resnet18"
  pretrained: true
  checkpoint_path: null

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  image_size: 224
  early_stopping: 10
  mixed_precision: true

# Конфигурируемые аугментации (все выключены по умолчанию)
augmentation:
  horizontal_flip: false
  vertical_flip: false
  random_rotate: false
  random_crop: false
  brightness_contrast: false
  hue_saturation: false
  coarse_dropout: false

logging:
  use_wandb: false
  wandb_project: "cv_hackathon"
  save_dir: "checkpoints"
  log_interval: 10
